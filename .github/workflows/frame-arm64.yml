name: Steam Frame ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-frame-arm64-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build native OpenXR ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Frame input binding and gesture tests
        run: |
          cat > "$RUNNER_TEMP/xrinputbindings-test-main.cpp" <<'EOF'
          #define DOCTEST_CONFIG_IMPLEMENT
          #include "doctest.h"
          int main(int argc, char** argv) { doctest::Context context; context.applyCommandLine(argc, argv); return context.run(); }
          EOF
          g++ -std=c++20 -Ithird-party/include -Isrc \
            tests/input/test-xrinputbindings.cpp "$RUNNER_TEMP/xrinputbindings-test-main.cpp" \
            -o "$RUNNER_TEMP/test-xrinputbindings"
          "$RUNNER_TEMP/test-xrinputbindings"
          tests/frame/test-frame-tools.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake bison cmake libasound2-dev libdrm-dev libegl-dev \
            libgbm-dev libglu1-mesa-dev libgl1-mesa-dev libpipewire-0.3-dev \
            libudev-dev libwayland-dev libwayland-egl-backend-dev libx11-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev \
            libxtst-dev libtool libgpiod-dev nasm zlib1g-dev

      - name: Calculate external cache key
        run: |
          echo "EXT_HASH=$(cat platforms/config.sh platforms/linux-aarch64/external.sh platforms/linux-aarch64/*.patch | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

      - name: Restore external dependency cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: external
          key: frame-linux-aarch64-release-${{ env.EXT_HASH }}
          restore-keys: |
            frame-linux-aarch64-partial-${{ env.EXT_HASH }}-

      - name: Build native ARM64 dependencies
        run: BUILD_TYPE=Release ./platforms/linux-aarch64/external.sh

      - if: success() && steps.cache.outputs.cache-hit != 'true'
        name: Save completed external dependency cache
        uses: actions/cache/save@v5
        with:
          path: external
          key: frame-linux-aarch64-release-${{ env.EXT_HASH }}

      - if: failure() && steps.cache.outputs.cache-hit != 'true'
        name: Preserve partial external dependency cache
        uses: actions/cache/save@v5
        with:
          path: external
          key: frame-linux-aarch64-partial-${{ env.EXT_HASH }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set build revision
        run: |
          sed -i "s/9999/$(git rev-list --count HEAD)/; s/unknown/$(git rev-parse --short=12 HEAD)/" src/core/git_version.h

      - name: Configure native Steam Frame build
        run: |
          cmake \
            -DRENDERER=BGFX \
            -DPLATFORM=linux \
            -DARCH=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_XR=ON \
            -DBUILD_RPI=OFF \
            -DBUILD_RK3588=OFF \
            -B build/frame-arm64

      - name: Build application
        run: cmake --build build/frame-arm64 --parallel "$(nproc)"

      - name: Verify artifact architecture and XR configuration
        run: |
          file build/frame-arm64/VPinballX_BGFX
          readelf -h build/frame-arm64/VPinballX_BGFX | grep -E 'Class:|Machine:'
          readelf -h build/frame-arm64/VPinballX_BGFX | grep -q 'Machine:.*AArch64'
          grep -q '^ENABLE_XR:BOOL=ON$' build/frame-arm64/CMakeCache.txt

      - name: Stage Frame artifact
        run: |
          mkdir -p tmp/frame-arm64/tools/frame
          cp build/frame-arm64/VPinballX_BGFX tmp/frame-arm64/
          cp -a build/frame-arm64/*.so* tmp/frame-arm64/
          cp -a build/frame-arm64/assets build/frame-arm64/plugins build/frame-arm64/scripts build/frame-arm64/docs tmp/frame-arm64/
          cp tools/frame/install-bundle.sh tools/frame/add-table-entry.sh tmp/frame-arm64/tools/frame/
          cp tools/frame/install-bundle.sh tools/frame/add-table-entry.sh tmp/
          printf 'source=%s\nrun_id=%s\nrun_attempt=%s\narchitecture=aarch64\nrenderer=BGFX\nopenxr=enabled\n' \
            "$(git rev-parse HEAD)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > tmp/frame-arm64/BUILD-METADATA.txt
          (
            cd tmp/frame-arm64
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          bundle="VPXFrame-linux-aarch64-$(git rev-parse --short=12 HEAD).tar.gz"
          tar -czf "tmp/$bundle" -C tmp/frame-arm64 .
          (cd tmp && sha256sum "$bundle" > "$bundle.sha256")

      - name: Upload Steam Frame build artifact
        uses: actions/upload-artifact@v7
        with:
          name: VPXFrame-linux-aarch64-${{ github.sha }}
          retention-days: 7
          path: |
            tmp/VPXFrame-linux-aarch64-*.tar.gz
            tmp/VPXFrame-linux-aarch64-*.tar.gz.sha256
            tmp/install-bundle.sh
            tmp/add-table-entry.sh
          archive: true
          compression-level: 0
